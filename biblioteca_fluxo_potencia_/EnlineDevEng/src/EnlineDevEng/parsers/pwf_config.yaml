


# INCOMPLETO (ISTO É: NÃO CONTÉM TODOS OS MNEMÔNICOS DO ANAREDE)
regras_gerais:



  - df_alvo: "dbarDF"
    coluna_merge_alvo: "grupo_de_base_de_tensao"
    df_auxiliar: "dgbtDF"
    coluna_merge_auxiliar: "grupo"
    colunas_coletar:
      - tensao: "tensao_base"
    valores_padrao_merge: # Nem todos são valores adotados pelo ANAREDE
      tensao: 1000.0
        

  - df_alvo: "dbarDF"
    coluna_merge_alvo: "grupo_de_limite_de_tensao"
    df_auxiliar: "dgltDF"
    coluna_merge_auxiliar: "grupo"
    colunas_coletar:
      - limite_minimo: limite_minimo
      - limite_maximo: limite_maximo
      - limite_minimo_em_emergencia: limite_minimo_em_emergencia
      - limite_maximo_em_emergencia: limite_maximo_em_emergencia
    valores_padrao_merge:
      limite_minimo: 0.8 # Adotado pelo Anarede
      limite_maximo: 1.2 # Adotado pelo Anarede
      limite_minimo_em_emergencia: 0.8 # Adotado pelo Anarede
      limite_maximo_em_emergencia: 1.2 # Adotado pelo Anarede

  
  - df_alvo: "dbarDF"
    coluna_merge_alvo: "numero"
    df_auxiliar: "dgerDF"
    coluna_merge_auxiliar: "numero"
    colunas_coletar:
      - geracao_ativa_minima: geracao_ativa_minima
      - geracao_ativa_maxima: geracao_ativa_maxima
      - fator_de_participacao: fator_de_participacao
      - fator_de_potencia_nominal: fator_de_potencia_nominal
      - reatancia_de_maquina: reatancia_de_maquina
    valores_padrao_merge:
      geracao_ativa_minima: 0.0 # Adotado pelo Anarede
      geracao_ativa_maxima: 99999 # Adotado pelo Anarede
      fator_de_participacao: 0.0 # Adotado pelo Anarede
      fator_de_potencia_nominal: 1.0 # Adotado pelo Desenvolvedor
      reatancia_de_maquina: 100 # Adotado pelo Desenvolvedor



  - df_alvo: "dlinDF"
    coluna_merge_alvo: "para"
    df_auxiliar: "dbarDF"
    coluna_merge_auxiliar: "numero"
    colunas_coletar:
      - tensao_minima: tensao_minima
      - tensao_maxima: tensao_maxima
      - barra_controlada: barra_controlada_por_trafo
    valores_padrao_merge:
      tensao_minima: 0.8 # Adotado pelo Anarede
      tensao_maxima: 1.2 # Adotado pelo Anarede
      

regras_gerais_2:
  
  # Adição de barras PQV (barra cuja tensão é controlada)
  - df_alvo: "dbarDF"
    df_auxiliar: "dlinDF"
    coluna_numero_df_alvo: "numero"
    coluna_tipo_df_alvo: "tipo"
    coluna_barra_controlada_df_auxiliar: "barra_controlada"
    coluna_tap_min_df_auxiliar: "tap_minimo"
    tipo_barra: "pqv"

    



