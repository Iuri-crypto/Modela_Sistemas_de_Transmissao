# Especificação de empacotamento do Python (PEP 517/518/621)

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EnlineDevEng"
version = "0.1.0"
description = "Biblioteca orientada a objetos para modelagem e simulação de redes elétricas de transmissão."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Iuri", email = "lorenzop0o9i8u7@gmail.com" }
]
license = { text = "MIT" }


dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.16.3",
    "pandas>=2.3.3,<3.0.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"EnlineDevEng" = ["*", "**/*"]
"EnlineDevEng.output" = ["*", "**/*"]
"EnlineDevEng.tests" = ["*", "**/*"]