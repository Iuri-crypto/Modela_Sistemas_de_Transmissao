# Especificação de empacotamento do Python (PEP 517/518/621)

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EnlineDevEng"
version = "0.1.0"
description = "Biblioteca orientada a objetos para modelagem e simulação de redes elétricas de transmissão."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Iuri", email = "lorenzop0o9i8u7@gmail.com" }
]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "pyyaml",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"
"EnlineDevEng.output" = "output"
"EnlineDevEng.tests" = "tests"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["EnlineDevEng*", "output*", "tests*"]

[tool.setuptools.package-data]
"EnlineDevEng.output" = ["*", "**/*"]
"EnlineDevEng.tests" = ["*", "**/*"]